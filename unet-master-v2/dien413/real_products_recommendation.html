<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品推荐系统 - 真实商品版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 15px;
            color: white;
        }
        .main-container {
            max-width: 1600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0,217,255,0.5);
        }
        .section-title {
            color: #00d9ff;
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .product-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .product-card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.15);
        }
        .product-card.selected-history {
            border-color: #ff6b6b;
            box-shadow: 0 0 15px rgba(255,107,107,0.5);
        }
        .product-card.selected-candidate {
            border-color: #4ecdc4;
            box-shadow: 0 0 15px rgba(78,205,196,0.5);
        }
        .product-card.recommended {
            border-color: #ffd93d;
            box-shadow: 0 0 20px rgba(255,217,61,0.8);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .product-image {
            width: 100%;
            height: 100px;
            object-fit: cover;
            background: #f0f0f0;
        }
        .product-info {
            padding: 8px;
            text-align: center;
        }
        .product-name {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 3px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-price {
            color: #ff6b6b;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .product-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-top: 5px;
        }
        .tag-history {
            background: rgba(255,107,107,0.3);
            color: #ff6b6b;
        }
        .tag-candidate {
            background: rgba(78,205,196,0.3);
            color: #4ecdc4;
        }
        .action-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .selection-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .count-badge {
            background: rgba(0,217,255,0.2);
            color: #00d9ff;
            padding: 3px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 40px;
            font-size: 1rem;
            border-radius: 50px;
            color: white;
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto;
        }
        .btn-generate:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(102,126,234,0.6);
        }
        .btn-generate:disabled {
            background: #555;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }
        .result-section {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            display: none;
        }
        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
        }
        .result-product {
            display: inline-block;
            background: white;
            border-radius: 12px;
            padding: 15px;
            color: #333;
            max-width: 250px;
        }
        .result-product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .result-product-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .result-product-price {
            color: #ff6b6b;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .result-product-score {
            margin-top: 10px;
            padding: 8px;
            background: rgba(56,239,125,0.2);
            border-radius: 8px;
            color: #11998e;
            font-size: 0.9rem;
        }
        .instructions {
            background: rgba(102,126,234,0.2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 3px solid #667eea;
            font-size: 0.9rem;
        }
        .step {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .step-number {
            width: 24px;
            height: 24px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .category-tab {
            padding: 6px 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            font-size: 0.85rem;
        }
        .category-tab:hover, .category-tab.active {
            background: rgba(102,126,234,0.3);
            border-color: #667eea;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .loading-overlay.show {
            display: flex;
        }
        .loading-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #667eea;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102,126,234,0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p style="font-size: 1rem;">正在分析用户行为并生成推荐...</p>
        </div>
    </div>

    <div class="main-container">
        <h1>🛒 商品推荐系统</h1>

        <div class="instructions">
            <div class="step">
                <span class="step-number">1</span>
                <span>选择商品类别</span>
            </div>
            <div class="step">
                <span class="step-number">2</span>
                <span>点击<strong style="color:#ff6b6b">曾经浏览过</strong>的商品（红色边框）</span>
            </div>
            <div class="step">
                <span class="step-number">3</span>
                <span>点击<strong style="color:#4ecdc4">想要推荐</strong>的商品（青色边框）</span>
            </div>
            <div class="step">
                <span class="step-number">4</span>
                <span>点击"🎯 生成推荐"按钮</span>
            </div>
        </div>

        <div class="category-tabs" id="categoryTabs">
            <div class="category-tab active" data-category="all">全部</div>
            <div class="category-tab" data-category="phone">📱 手机</div>
            <div class="category-tab" data-category="computer">💻 电脑</div>
            <div class="category-tab" data-category="tablet">📱 平板</div>
            <div class="category-tab" data-category="watch">⌚ 手表</div>
            <div class="category-tab" data-category="clothes">👕 衣服</div>
            <div class="category-tab" data-category="pants">👖 裤子</div>
            <div class="category-tab" data-category="shoes">👟 鞋子</div>
            <div class="category-tab" data-category="bag">👜 包包</div>
            <div class="category-tab" data-category="headphones">🎧 耳机</div>
            <div class="category-tab" data-category="camera">📷 相机</div>
            <div class="category-tab" data-category="game">🎮 游戏机</div>
            <div class="category-tab" data-category="furniture">🛋️ 家具</div>
            <div class="category-tab" data-category="kitchen">🍳 厨具</div>
            <div class="category-tab" data-category="beauty">💄 美妆</div>
            <div class="category-tab" data-category="skincare">🧴 护肤</div>
            <div class="category-tab" data-category="snacks">🍿 零食</div>
            <div class="category-tab" data-category="drinks">🥤 饮料</div>
        </div>

        <div class="action-section">
            <div class="selection-info">
                <h3 class="section-title mb-0">📚 我的浏览历史</h3>
                <span class="count-badge" id="historyCount">已选: 0 个</span>
            </div>
            <div class="products-grid" id="historyProducts"></div>
        </div>

        <div class="action-section">
            <div class="selection-info">
                <h3 class="section-title mb-0">🎁 推荐候选商品</h3>
                <span class="count-badge" id="candidateCount">已选: 0 个</span>
            </div>
            <div class="products-grid" id="candidateProducts"></div>
        </div>

        <button class="btn-generate" id="generateBtn" disabled>
            🎯 生成个性化推荐
        </button>

        <div class="result-section" id="resultSection">
            <div class="result-title">🌟 系统推荐结果</div>
            <div class="result-product" id="resultProduct">
                <img src="" alt="推荐商品" id="resultImage">
                <div class="result-product-name" id="resultName"></div>
                <div class="result-product-price" id="resultPrice"></div>
                <div class="result-product-score" id="resultScore"></div>
            </div>
        </div>
    </div>

        let currentCategory = "all";
        let selectedHistory = new Set();
        let selectedCandidates = new Set();

        function createProductCard(product, isHistory = false) {
            const card = document.createElement("div");
            card.className = "product-card";
            card.dataset.productId = product.id;

            card.innerHTML = `
                <img src="${product.image}" alt="${product.name}" class="product-image"
                     onerror="this.src='https://via.placeholder.com/300x300/cccccc/666666?text=${encodeURIComponent(product.name)}'">
                <div class="product-info">
                    <div class="product-name" title="${product.name}">${product.name}</div>
                    <div class="product-price">${product.price}</div>
                    <div class="product-tag ${isHistory ? "tag-history" : "tag-candidate"}" style="display:none;">
                        ${isHistory ? "📖 已浏览" : "🎯 待推荐"}
                    </div>
                </div>
            `;

            card.addEventListener("click", () => toggleSelection(card, product, isHistory));

            return card;
        }

        function toggleSelection(card, product, isHistory) {
            if (isHistory) {
                if (selectedHistory.has(product.id)) {
                    selectedHistory.delete(product.id);
                    card.classList.remove("selected-history");
                    card.querySelector(".tag-history").style.display = "none";
                } else {
                    selectedHistory.add(product.id);
                    card.classList.add("selected-history");
                    card.querySelector(".tag-history").style.display = "inline-block";
                }
                updateHistoryCount();
            } else {
                if (selectedCandidates.has(product.id)) {
                    selectedCandidates.delete(product.id);
                    card.classList.remove("selected-candidate");
                    card.querySelector(".tag-candidate").style.display = "none";
                } else {
                    selectedCandidates.add(product.id);
                    card.classList.add("selected-candidate");
                    card.querySelector(".tag-candidate").style.display = "inline-block";
                }
                updateCandidateCount();
            }

            updateGenerateButton();
        }

        function updateHistoryCount() {
            document.getElementById("historyCount").textContent = `已选: ${selectedHistory.size} 个`;
        }

        function updateCandidateCount() {
            document.getElementById("candidateCount").textContent = `已选: ${selectedCandidates.size} 个`;
        }

        function updateGenerateButton() {
            const btn = document.getElementById("generateBtn");
            btn.disabled = selectedHistory.size === 0 || selectedCandidates.size === 0;
        }

        function initializeProducts() {
            const historyContainer = document.getElementById("historyProducts");
            const candidateContainer = document.getElementById("candidateProducts");

            historyContainer.innerHTML = "";
            candidateContainer.innerHTML = "";

            const filteredProducts = currentCategory === "all"
                ? allProducts
                : allProducts.filter(p => p.category === currentCategory);

            filteredProducts.forEach(product => {
                historyContainer.appendChild(createProductCard(product, true));
                candidateContainer.appendChild(createProductCard(product, false));
            });
        }

        document.querySelectorAll(".category-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".category-tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                currentCategory = tab.dataset.category;
                initializeProducts();
            });
        });

        async function generateRecommendation() {
            const loadingOverlay = document.getElementById("loadingOverlay");
            const resultSection = document.getElementById("resultSection");

            loadingOverlay.classList.add("show");
            resultSection.classList.remove("show");

            const historyItems = Array.from(selectedHistory);
            const candidateItems = Array.from(selectedCandidates);

            const getCategoryById = (id) => {
                const product = allProducts.find(p => p.id === id);
                return product ? product.category.toUpperCase() : "794437";
            };

            const requestData = {
                user_id: "USER001",
                history_items: historyItems,
                history_categories: historyItems.map(id => getCategoryById(id)),
                candidate_items: candidateItems,
                candidate_categories: candidateItems.map(id => getCategoryById(id))
            };

            try {
                const response = await fetch("http://localhost:5001/api/dien/recommend", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (data.recommendations && data.recommendations.length > 0) {
                    const topRecommendation = data.recommendations[0];
                    const product = allProducts.find(p => p.id === topRecommendation.item_id);

                    if (product) {
                        document.getElementById("resultImage").src = product.image;
                        document.getElementById("resultName").textContent = product.name;
                        document.getElementById("resultPrice").textContent = product.price;
                        document.getElementById("resultScore").textContent =
                            `预测点击概率: ${(topRecommendation.score * 100).toFixed(1)}%`;

                        resultSection.classList.add("show");

                        document.querySelectorAll("#candidateProducts .product-card").forEach(card => {
                            if (card.dataset.productId === topRecommendation.item_id) {
                                card.classList.add("recommended");
                            }
                        });

                        resultSection.scrollIntoView({ behavior: "smooth", block: "center" });
                    }
                }
            } catch (error) {
                console.error("Error:", error);
                alert("生成推荐时出错，请确保后端服务正在运行！");
            } finally {
                loadingOverlay.classList.remove("show");
            }
        }

        document.getElementById("generateBtn").addEventListener("click", generateRecommendation);

        initializeProducts();
    </script>
